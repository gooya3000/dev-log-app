<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 오류</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center mt-5">
            <h1 class="h3 mb-3">오류가 발생했습니다</h1>
            <div class="alert alert-danger">
                <span th:if="${status}" th:text="${status} + ' — '"></span>
                <span th:if="${message}" th:text="${message}">요청을 처리할 수 없습니다.</span>
                <span th:unless="${message}">요청을 처리할 수 없습니다.</span>
            </div>
            <a th:href="@{/}" class="btn btn-primary">홈으로</a>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
