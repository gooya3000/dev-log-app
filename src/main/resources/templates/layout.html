<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<th:block th:fragment="commonStyles">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .draft-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 1rem;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            max-height: 32rem;
            overflow-y: auto;
        }
    </style>
</th:block>
</head>
<body>

<nav th:fragment="nav" class="navbar navbar-expand-md bg-light border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">📓 DevLog</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item" sec:authorize="hasRole('USER')">
                    <a class="nav-link" th:href="@{/logs}">회고 목록</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('USER')">
                    <a class="nav-link" th:href="@{/logs/new}">새 회고</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/vault/users}">사용자 관리</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <span sec:authorize="hasRole('USER')">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
                    </form>
                </span>
                <span sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/vault/logout}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">관리자 로그아웃</button>
                    </form>
                </span>
                <span sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-primary btn-sm me-1" th:href="@{/unlock}">로그인</a>
                    <a class="btn btn-primary btn-sm" th:href="@{/register}">회원가입</a>
                </span>
            </div>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
