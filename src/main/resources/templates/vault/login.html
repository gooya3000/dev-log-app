<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 관리자 로그인</title>
    <style th:replace="~{layout :: commonStyles}"></style>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<h1>관리자 로그인</h1>

<div th:if="${param.error}" class="error">
    로그인 실패. Admin Passphrase를 확인하세요.
</div>

<form th:action="@{/vault/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label for="password">Admin Passphrase</label>
    <input type="password" id="password" name="password" autocomplete="current-password">

    <button type="submit">로그인</button>
</form>

<p><a th:href="@{/unlock}">사용자 로그인</a></p>
</body>
</html>
