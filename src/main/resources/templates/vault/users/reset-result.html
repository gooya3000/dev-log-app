<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — Passphrase 재설정 완료</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="h3 mb-4">Passphrase 재설정 완료</h1>

            <div class="alert alert-danger">
                <strong>주의: 이 화면은 한 번만 표시됩니다. 지금 바로 새 Passphrase를 기록하세요.</strong>
                <hr>
                <p class="mb-1">사용자 ID: <code th:text="${userId}"></code></p>
                <p class="mb-0 fs-5">새 임시 Passphrase: <code th:text="${newPassphrase}"></code></p>
            </div>

            <p class="text-success">새 Passphrase를 비밀번호 매니저에 저장한 후 이 페이지를 닫으세요.</p>
            <a th:href="@{/vault/users}" class="btn btn-primary">사용자 목록으로</a>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
