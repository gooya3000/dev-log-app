<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 사용자 관리</title>
    <style th:replace="~{layout :: commonStyles}"></style>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<h1>사용자 관리</h1>

<div th:if="${#lists.isEmpty(users)}" style="margin-top:1rem; color:#666;">
    등록된 사용자가 없습니다. 사용자는 <a th:href="@{/register}">/register</a> 페이지에서 가입합니다.
</div>

<table th:if="${!#lists.isEmpty(users)}" style="width:100%; border-collapse:collapse; margin-top:1rem;">
    <thead>
    <tr style="border-bottom:2px solid #333;">
        <th style="text-align:left; padding:0.4rem;">사용자 ID</th>
        <th style="text-align:left; padding:0.4rem;">작업</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}" style="border-bottom:1px solid #eee;">
        <td style="padding:0.4rem;" th:text="${user.id}"></td>
        <td style="padding:0.4rem;">
            <a th:href="@{/vault/users/{id}/reset-passphrase(id=${user.id})}">Passphrase 재설정</a>
            <form th:action="@{/vault/users/{id}/delete(id=${user.id})}" method="post"
                  style="display:inline; margin-left:0.5rem;"
                  onsubmit="return confirm('사용자를 삭제하시겠습니까?')">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" style="color:#c00; background:none; border:none; cursor:pointer; padding:0;">삭제</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
