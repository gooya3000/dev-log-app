<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 사용자 관리</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container pb-4">
    <h1 class="h3 mb-4">사용자 관리</h1>

    <div th:if="${#lists.isEmpty(users)}" class="text-muted">
        등록된 사용자가 없습니다. 사용자는 <a th:href="@{/register}">/register</a> 페이지에서 가입합니다.
    </div>

    <table th:if="${!#lists.isEmpty(users)}" class="table table-hover">
        <thead>
        <tr>
            <th>사용자 ID</th>
            <th>작업</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td>
                <a th:href="@{/vault/users/{id}/reset-passphrase(id=${user.id})}"
                   class="btn btn-outline-warning btn-sm me-2">Passphrase 재설정</a>
                <form th:action="@{/vault/users/{id}/delete(id=${user.id})}" method="post"
                      class="d-inline"
                      onsubmit="return confirm('사용자를 삭제하시겠습니까?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
