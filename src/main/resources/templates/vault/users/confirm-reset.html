<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — Passphrase 재설정</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="h3 mb-4">Passphrase 재설정</h1>

            <div class="alert alert-warning">
                <p class="mb-1">사용자 <strong th:text="${userId}"></strong>의 임시 Passphrase를 새로 발급합니다.</p>
                <p class="mb-0">이전 Passphrase는 즉시 무효화됩니다.</p>
            </div>

            <form th:action="@{/vault/users/{id}/reset-passphrase(id=${userId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">새 임시 Passphrase 발급</button>
                    <a th:href="@{/vault/users}" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
