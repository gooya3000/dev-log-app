<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — Passphrase 재설정</title>
    <style th:replace="~{layout :: commonStyles}"></style>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<h1>Passphrase 재설정</h1>
<p>사용자 <strong th:text="${userId}"></strong>의 임시 Passphrase를 새로 발급합니다.</p>
<p>이전 Passphrase는 즉시 무효화됩니다.</p>

<form th:action="@{/vault/users/{id}/reset-passphrase(id=${userId})}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit">새 임시 Passphrase 발급</button>
    <a th:href="@{/vault/users}" style="margin-left:0.5rem;">취소</a>
</form>
</body>
</html>
