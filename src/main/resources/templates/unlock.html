<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 로그인</title>
    <style th:replace="~{layout :: commonStyles}"></style>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<h1>로그인</h1>

<div th:if="${param.registered}" class="info">
    가입이 완료되었습니다. 로그인하세요.
</div>

<div th:if="${param.error}" class="error">
    로그인 실패. Passphrase를 확인하세요.
</div>

<form th:action="@{/unlock}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label for="userId">사용자 ID</label>
    <input type="text" id="userId" name="userId" value="self">

    <label for="passphrase">Passphrase</label>
    <input type="password" id="passphrase" name="passphrase" autocomplete="current-password">

    <button type="submit">로그인</button>
</form>

<p><a th:href="@{/vault/login}">관리자 로그인</a></p>
</body>
</html>
