<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 로그인</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-4">로그인</h1>

            <div th:if="${param.registered}" class="alert alert-success">
                가입이 완료되었습니다. 로그인하세요.
            </div>
            <div th:if="${param.error}" class="alert alert-danger">
                로그인 실패. Passphrase를 확인하세요.
            </div>

            <form th:action="@{/unlock}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="userId" class="form-label">사용자 ID</label>
                    <input type="text" id="userId" name="userId" class="form-control" value="">
                </div>
                <div class="mb-4">
                    <label for="passphrase" class="form-label">Passphrase</label>
                    <input type="password" id="passphrase" name="passphrase" class="form-control" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">로그인</button>
            </form>

            <p class="mt-3 text-center small">
                <a th:href="@{/vault/login}" class="text-muted">관리자 로그인</a>
            </p>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
