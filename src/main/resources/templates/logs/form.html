<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 회고 작성</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container pb-4">
    <h1 class="h3 mb-4" th:text="${isNew} ? '새 회고 작성' : '회고 수정'">회고</h1>

    <form th:action="${isNew} ? @{/logs} : @{/logs/{id}(id=${logId})}"
          th:object="${devLogForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3">
            <label for="date" class="form-label">날짜 *</label>
            <input type="date" id="date" th:field="*{date}" class="form-control">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>

        <div class="mb-3">
            <label for="title" class="form-label">제목 *</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="오늘의 제목">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
            <label for="tags" class="form-label">태그 (콤마 구분)</label>
            <input type="text" id="tags" th:field="*{tags}" class="form-control" placeholder="spring, java, io">
        </div>

        <div class="mb-3">
            <label for="whatIDid" class="form-label">오늘 한 일 *</label>
            <textarea id="whatIDid" th:field="*{whatIDid}" class="form-control" rows="4" placeholder="오늘 무엇을 했나요?"></textarea>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('whatIDid')}" th:errors="*{whatIDid}"></div>
        </div>

        <div class="mb-3">
            <label for="whatILearned" class="form-label">배운 것 *</label>
            <textarea id="whatILearned" th:field="*{whatILearned}" class="form-control" rows="4" placeholder="무엇을 배웠나요?"></textarea>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('whatILearned')}" th:errors="*{whatILearned}"></div>
        </div>

        <div class="mb-3">
            <label for="problems" class="form-label">막힌 부분 / 이슈</label>
            <textarea id="problems" th:field="*{problems}" class="form-control" rows="3" placeholder="어디서 막혔나요?"></textarea>
        </div>

        <div class="mb-3">
            <label for="tomorrow" class="form-label">내일 할 일</label>
            <textarea id="tomorrow" th:field="*{tomorrow}" class="form-control" rows="3" placeholder="내일 무엇을 할 건가요?"></textarea>
        </div>

        <div class="mb-4">
            <label for="mood" class="form-label">기분</label>
            <select id="mood" th:field="*{mood}" class="form-select">
                <option value="">-- 선택 --</option>
                <option th:each="m : ${moods}" th:value="${m}" th:text="${m}"></option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="${isNew} ? '저장' : '수정 저장'">저장</button>
            <a th:href="${isNew} ? @{/logs} : @{/logs/{id}(id=${logId})}" class="btn btn-outline-secondary">취소</a>
        </div>
    </form>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
