<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 블로그 초안</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container pb-4">
    <h1 class="h3">블로그 초안</h1>
    <p class="text-muted mb-3">
        원본 회고:
        <a th:href="@{/logs/{id}(id=${log.id})}" th:text="${log.title}">제목</a>
    </p>

    <div class="mb-2 d-flex align-items-center gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="copyDraft()">Markdown 복사</button>
        <span id="copyFeedback" class="text-success small"></span>
    </div>

    <pre id="draft" class="draft-box" th:text="${markdown}">생성된 마크다운</pre>

    <div class="mt-3">
        <a th:href="@{/logs/{id}(id=${log.id})}" class="btn btn-outline-secondary btn-sm">상세로 돌아가기</a>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
<script>
    function copyDraft() {
        const text = document.getElementById('draft').innerText;
        const feedback = document.getElementById('copyFeedback');
        navigator.clipboard.writeText(text).then(
            () => { feedback.textContent = '복사 완료'; },
            () => { feedback.textContent = '복사 실패 — 직접 선택해 복사하세요'; }
        );
    }
</script>
</body>
</html>
