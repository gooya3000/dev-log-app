<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 회고 상세</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container pb-4">
    <h1 class="h3" th:text="${log.title}">회고 제목</h1>
    <p class="text-muted mb-4">
        <span th:text="${log.date}"></span>
        <span th:if="${log.mood}" th:text="' · ' + ${log.mood}"></span>
        <span th:if="${!#lists.isEmpty(log.tags)}"
              th:text="' · ' + ${#strings.listJoin(log.tags, ', ')}"></span>
    </p>

    <section class="mb-3">
        <h2 class="h5">오늘 한 일</h2>
        <p th:text="${log.whatIDid}" style="white-space:pre-wrap;"></p>
    </section>

    <section class="mb-3">
        <h2 class="h5">배운 것</h2>
        <p th:text="${log.whatILearned}" style="white-space:pre-wrap;"></p>
    </section>

    <section class="mb-3" th:if="${log.problems}">
        <h2 class="h5">막힌 부분 / 이슈</h2>
        <p th:text="${log.problems}" style="white-space:pre-wrap;"></p>
    </section>

    <section class="mb-4" th:if="${log.tomorrow}">
        <h2 class="h5">내일 할 일</h2>
        <p th:text="${log.tomorrow}" style="white-space:pre-wrap;"></p>
    </section>

    <div class="d-flex gap-2 mb-4 flex-wrap">
        <a th:href="@{/logs/{id}/edit(id=${log.id})}" class="btn btn-outline-primary btn-sm">수정</a>
        <form th:action="@{/logs/{id}/delete(id=${log.id})}" method="post" class="d-inline"
              onsubmit="return confirm('정말 삭제하시겠습니까?')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
        </form>
        <a th:href="@{/logs}" class="btn btn-outline-secondary btn-sm">목록으로</a>
    </div>

    <section class="border-top pt-4">
        <h2 class="h5">블로그 초안 생성</h2>
        <p class="text-muted small">
            본인의 Gemini API 키를 입력하면 이 회고를 기반으로 기술 블로그 초안(Markdown)을 받아옵니다.
            키는 요청 1회 사용 후 즉시 폐기되며 서버에 저장되지 않습니다.
            키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 무료로 발급할 수 있습니다.
        </p>

        <div th:if="${aiError}" class="alert alert-danger" th:text="${aiError}"></div>

        <form th:action="@{/logs/{id}/blog-draft(id=${log.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="apiKey" class="form-label">Gemini API 키</label>
                <input type="password" id="apiKey" name="apiKey" class="form-control" autocomplete="off" required>
                <div th:if="${blogDraftError}" class="text-danger small mt-1" th:text="${blogDraftError}"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">초안 생성</button>
        </form>
    </section>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
