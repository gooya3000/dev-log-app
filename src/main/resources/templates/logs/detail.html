<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 회고 상세</title>
    <style th:replace="~{layout :: commonStyles}"></style>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<h1 th:text="${log.title}">회고 제목</h1>
<p style="color:#666;">
    <span th:text="${log.date}"></span>
    <span th:if="${log.mood}" th:text="' | ' + ${log.mood}"></span>
    <span th:if="${!#lists.isEmpty(log.tags)}"
          th:text="' | ' + ${#strings.listJoin(log.tags, ', ')}"></span>
</p>

<section>
    <h2>오늘 한 일</h2>
    <p th:text="${log.whatIDid}" style="white-space:pre-wrap;"></p>
</section>

<section>
    <h2>배운 것</h2>
    <p th:text="${log.whatILearned}" style="white-space:pre-wrap;"></p>
</section>

<section th:if="${log.problems}">
    <h2>막힌 부분 / 이슈</h2>
    <p th:text="${log.problems}" style="white-space:pre-wrap;"></p>
</section>

<section th:if="${log.tomorrow}">
    <h2>내일 할 일</h2>
    <p th:text="${log.tomorrow}" style="white-space:pre-wrap;"></p>
</section>

<div style="margin-top:1.5rem;">
    <a th:href="@{/logs/{id}/edit(id=${log.id})}"><button>수정</button></a>

    <form th:action="@{/logs/{id}/delete(id=${log.id})}" method="post" style="display:inline; margin-left:0.5rem;"
          onsubmit="return confirm('정말 삭제하시겠습니까?')">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" style="color:#c00;">삭제</button>
    </form>

    <a th:href="@{/logs}" style="margin-left:0.5rem;">목록으로</a>
</div>

<section style="margin-top:2rem; padding-top:1rem; border-top:1px solid #ccc;">
    <h2>블로그 초안 생성</h2>
    <p style="color:#666; font-size:0.9rem;">
        본인의 Gemini API 키를 입력하면 이 회고를 기반으로 기술 블로그 초안(Markdown)을 받아옵니다.
        키는 요청 1회 사용 후 즉시 폐기되며 서버에 저장되지 않습니다.
        키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 에서 무료로 발급할 수 있습니다.
    </p>

    <p th:if="${aiError}" class="error" th:text="${aiError}"></p>

    <form th:action="@{/logs/{id}/blog-draft(id=${log.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="apiKey">Gemini API 키</label>
        <input type="password" id="apiKey" name="apiKey" autocomplete="off" required>
        <p th:if="${blogDraftError}" class="error" th:text="${blogDraftError}"></p>
        <button type="submit">초안 생성</button>
    </form>
</section>
</body>
</html>
