<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 회고 목록</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container pb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">회고 목록</h1>
        <div class="d-flex gap-2">
            <a th:href="@{/logs/profile/passphrase}" class="btn btn-outline-secondary btn-sm">비밀번호 변경</a>
            <a th:href="@{/logs/new}" class="btn btn-primary btn-sm">새 회고 작성</a>
        </div>
    </div>

    <div th:if="${param['passphrase-changed'] != null}" class="alert alert-success">
        비밀번호가 변경되었습니다.
    </div>

    <div th:if="${#lists.isEmpty(logs)}" class="text-muted">
        아직 회고가 없습니다.
    </div>

    <table th:if="${!#lists.isEmpty(logs)}" class="table table-hover">
        <thead>
        <tr>
            <th>날짜</th>
            <th>제목</th>
            <th class="d-none d-md-table-cell">태그</th>
            <th class="d-none d-md-table-cell">기분</th>
            <th class="d-none d-lg-table-cell">작성일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td class="text-nowrap" th:text="${log.date}"></td>
            <td>
                <a th:href="@{/logs/{id}(id=${log.id})}" th:text="${log.title}"></a>
            </td>
            <td class="d-none d-md-table-cell text-muted small" th:text="${#strings.listJoin(log.tags, ', ')}"></td>
            <td class="d-none d-md-table-cell" th:text="${log.mood}"></td>
            <td class="d-none d-lg-table-cell text-muted small" th:text="${#temporals.format(log.createdAt, 'MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
