<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 비밀번호 변경</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-4">비밀번호 변경</h1>

            <form th:action="@{/logs/profile/passphrase}" method="post"
                  th:object="${passphraseChangeForm}" autocomplete="off">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <ul class="mb-0 ps-3">
                        <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                    </ul>
                </div>

                <div class="mb-3">
                    <label for="oldPassphrase" class="form-label">현재 비밀번호</label>
                    <input type="password" id="oldPassphrase" th:field="*{oldPassphrase}" class="form-control" autocomplete="current-password">
                    <div th:if="${#fields.hasErrors('oldPassphrase')}" th:errors="*{oldPassphrase}" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-3">
                    <label for="newPassphrase" class="form-label">새 비밀번호</label>
                    <input type="password" id="newPassphrase" th:field="*{newPassphrase}" class="form-control" autocomplete="new-password">
                    <div th:if="${#fields.hasErrors('newPassphrase')}" th:errors="*{newPassphrase}" class="text-danger small mt-1"></div>
                </div>

                <div class="mb-4">
                    <label for="newPassphraseConfirm" class="form-label">새 비밀번호 확인</label>
                    <input type="password" id="newPassphraseConfirm" th:field="*{newPassphraseConfirm}" class="form-control" autocomplete="new-password">
                    <div th:if="${#fields.hasErrors('newPassphraseConfirm')}" th:errors="*{newPassphraseConfirm}" class="text-danger small mt-1"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">변경</button>
                    <a th:href="@{/logs}" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
