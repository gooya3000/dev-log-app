<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 비밀번호 변경</title>
    <style th:replace="~{layout :: commonStyles}"></style>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<h1>비밀번호 변경</h1>

<form th:action="@{/logs/profile/passphrase}" method="post"
      th:object="${passphraseChangeForm}" autocomplete="off">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <!-- 글로벌 에러 표시 (form 안에서 th:object 바인딩 활용) -->
    <div th:if="${#fields.hasGlobalErrors()}" class="error" style="margin-bottom:1rem;">
        <ul style="margin:0; padding-left:1.2rem;">
            <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
        </ul>
    </div>

    <label for="oldPassphrase">현재 비밀번호</label>
    <input type="password" id="oldPassphrase" th:field="*{oldPassphrase}" autocomplete="current-password">
    <span th:if="${#fields.hasErrors('oldPassphrase')}" class="error"
          th:errors="*{oldPassphrase}"></span>

    <label for="newPassphrase">새 비밀번호</label>
    <input type="password" id="newPassphrase" th:field="*{newPassphrase}" autocomplete="new-password">
    <span th:if="${#fields.hasErrors('newPassphrase')}" class="error"
          th:errors="*{newPassphrase}"></span>

    <label for="newPassphraseConfirm">새 비밀번호 확인</label>
    <input type="password" id="newPassphraseConfirm" th:field="*{newPassphraseConfirm}" autocomplete="new-password">
    <span th:if="${#fields.hasErrors('newPassphraseConfirm')}" class="error"
          th:errors="*{newPassphraseConfirm}"></span>

    <button type="submit">변경</button>
    <a th:href="@{/logs}" style="margin-left:1rem;">취소</a>
</form>
</body>
</html>
