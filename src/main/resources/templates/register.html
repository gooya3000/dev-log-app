<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 가입</title>
    <style th:replace="~{layout :: commonStyles}"></style>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<h1>가입</h1>

<form th:action="@{/register}" th:object="${userRegisterForm}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label for="userId">사용자 ID</label>
    <input type="text" id="userId" th:field="*{userId}" autocomplete="username">
    <div th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="error"></div>

    <label for="passphrase">Passphrase</label>
    <input type="password" id="passphrase" th:field="*{passphrase}" autocomplete="new-password">
    <div th:if="${#fields.hasErrors('passphrase')}" th:errors="*{passphrase}" class="error"></div>

    <label for="passphraseConfirm">Passphrase 확인</label>
    <input type="password" id="passphraseConfirm" th:field="*{passphraseConfirm}" autocomplete="new-password">
    <div th:if="${#fields.hasErrors('passphraseConfirm')}" th:errors="*{passphraseConfirm}" class="error"></div>

    <button type="submit">가입</button>
</form>

<p><a th:href="@{/unlock}">이미 계정이 있으신가요? 로그인</a></p>
</body>
</html>
