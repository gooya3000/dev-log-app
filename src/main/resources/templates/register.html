<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog — 가입</title>
    <th:block th:replace="~{layout :: commonStyles}"></th:block>
</head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-4">가입</h1>

            <form th:action="@{/register}" th:object="${userRegisterForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="userId" class="form-label">사용자 ID</label>
                    <input type="text" id="userId" th:field="*{userId}" class="form-control" autocomplete="username">
                    <div th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="text-danger small mt-1"></div>
                </div>
                <div class="mb-3">
                    <label for="passphrase" class="form-label">Passphrase</label>
                    <input type="password" id="passphrase" th:field="*{passphrase}" class="form-control" autocomplete="new-password">
                    <div th:if="${#fields.hasErrors('passphrase')}" th:errors="*{passphrase}" class="text-danger small mt-1"></div>
                </div>
                <div class="mb-4">
                    <label for="passphraseConfirm" class="form-label">Passphrase 확인</label>
                    <input type="password" id="passphraseConfirm" th:field="*{passphraseConfirm}" class="form-control" autocomplete="new-password">
                    <div th:if="${#fields.hasErrors('passphraseConfirm')}" th:errors="*{passphraseConfirm}" class="text-danger small mt-1"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">가입</button>
            </form>

            <p class="mt-3 text-center small">
                <a th:href="@{/unlock}">이미 계정이 있으신가요? 로그인</a>
            </p>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
