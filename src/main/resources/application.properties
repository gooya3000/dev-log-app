spring.application.name=dev-log-app

# JSON 회고 파일 저장 루트. PLAN.md §4 참조.
devlog.storage.root=./data/logs

# 관리자 passphrase 등 로컬 비밀 설정을 application-local.properties 에서 추가 로드.
# 이 파일은 .gitignore 되어 있으며, 리포에는 application-local.properties.example 만 커밋됨.
# PLAN.md §5.7 참조.
spring.config.import=optional:file:./application-local.properties

# Gemini 어댑터 설정 — API 키는 여기 두지 않는다 (PLAN.md §5.1, §5.2)
devlog.ai.gemini.model=gemini-2.5-flash
devlog.ai.gemini.base-url=https://generativelanguage.googleapis.com
